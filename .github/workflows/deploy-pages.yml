name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - run: bun run build

  deploy-supabase:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --dry-run
      - run: supabase db push

  deploy-cloudflare:
    if: github.ref == 'refs/heads/main'
    needs: deploy-supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - id: pages_deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .output/public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          packageManager: bun
      - name: Check deployed Pages URL
        env:
          DEPLOYMENT_URL: ${{ steps.pages_deploy.outputs.deployment-url }}
        run: |
          node <<'NODE'
          const deploymentUrl = process.env.DEPLOYMENT_URL ?? "";
          let parsed;

          try {
            parsed = new URL(deploymentUrl);
          } catch {
            console.error("Invalid deployment URL: expected an HTTPS Cloudflare Pages root URL.");
            process.exit(1);
          }

          const isExactRoot =
            deploymentUrl === `https://${parsed.hostname}` ||
            deploymentUrl === `https://${parsed.hostname}/`;
          const isPagesRoot =
            isExactRoot &&
            parsed.protocol === "https:" &&
            parsed.hostname.endsWith(".pages.dev") &&
            parsed.hostname !== "pages.dev" &&
            parsed.username === "" &&
            parsed.password === "" &&
            parsed.port === "" &&
            parsed.pathname === "/" &&
            parsed.search === "" &&
            parsed.hash === "";

          if (!isPagesRoot) {
            console.error("Invalid deployment URL: expected an HTTPS *.pages.dev root URL without credentials, port, query, or fragment.");
            process.exit(1);
          }
          NODE
          curl --fail --show-error --silent --location "$DEPLOYMENT_URL"
